name: 🚀 Deploy Entre Sites para HostGator (entresites.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🌐 Sincronizar Arquivos com HostGator
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obter código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Subir arquivos para o servidor HostGator (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_ROOT || 'public_html/' }}
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            README.md
            .github/**
            .gitignore
