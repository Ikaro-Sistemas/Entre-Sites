name: 🚀 Deploy Entre Sites para HostGator (entresites.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🌐 Sincronizar Arquivos com HostGator (50.6.184.19)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obter código do repositório
        uses: actions/checkout@v4

      - name: 📦 Instalar LFTP
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp

      - name: 🚀 Sincronizar Arquivos com HostGator
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER || secrets.FTP_HOST || '50.6.184.19' }}
          FTP_USER: ${{ secrets.FTP_USERNAME || secrets.FTP_USER || 'ikaror83' }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_REMOTE_ROOT || 'public_html' }}
        run: |
          echo "🌐 Conectando diretamente ao IP da HostGator: $FTP_HOST"
          echo "👤 Usuário: $FTP_USER"
          
          # Remove barras redundantes
          TARGET_DIR=$(echo "$FTP_DIR" | sed 's|^/||;s|/$||')
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="public_html"; fi
          echo "📁 Diretório Alvo: $TARGET_DIR"

          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force no;
            set ftp:ssl-protect-data no;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mkdir -p $TARGET_DIR || true;
            mirror --reverse --verbose --delete-first \
              --exclude-glob .git* \
              --exclude-glob .git/** \
              --exclude-glob .github/** \
              --exclude-glob README.md \
              ./ $TARGET_DIR/
          "

      - name: ✅ Confirmação de Sucesso
        run: |
          echo "🎉 Deploy finalizado com sucesso para a HostGator!"
          echo "🌐 Acesse: https://entresites.com"
