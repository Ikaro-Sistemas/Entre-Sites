name: 🚀 Deploy WordPress → HostGator (entresites.com)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      clear_cache:
        description: "🗑️ Limpar cache após deploy?"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      full_sync:
        description: "🔄 Sincronização completa (sobrescreve tudo)?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  PHP_VERSION: "8.2"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Validação do Código WordPress
  # ─────────────────────────────────────────────────────────────
  validate:
    name: 🔍 Validar Código WordPress
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐘 Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: phpcs
          coverage: none

      - name: ✅ Verificar Sintaxe PHP
        run: |
          echo "🔍 Verificando sintaxe de arquivos PHP..."
          ERRORS=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "❌ Erro de sintaxe em: $file"
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -name "*.php" \
            -not -path "./.git/*" \
            -not -path "*/vendor/*" \
            -not -path "*/node_modules/*")
          if [ $ERRORS -gt 0 ]; then
            echo "💥 $ERRORS arquivo(s) com erro(s) de sintaxe!"
            exit 1
          fi
          echo "✅ Todos os arquivos PHP estão válidos!"

      - name: 🔒 Verificar Arquivos Sensíveis
        run: |
          echo "🔒 Verificando arquivos sensíveis no repositório..."
          FOUND=0
          for pattern in "wp-config.php" ".env" "*.pem" "*.key" "*.p12"; do
            if find . -name "$pattern" -not -path "./.git/*" 2>/dev/null | grep -q .; then
              echo "⚠️  AVISO: Arquivo sensível encontrado: $pattern"
              FOUND=1
            fi
          done
          if [ $FOUND -eq 1 ]; then
            echo "⚠️  Certifique-se que arquivos sensíveis estão no .gitignore!"
          else
            echo "✅ Nenhum arquivo sensível encontrado no repositório!"
          fi

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build de Assets do Tema Personalizado
  # ─────────────────────────────────────────────────────────────
  build-assets:
    name: 🎨 Build de Assets (CSS/JS)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: 📦 Instalar e Build do Tema Personalizado
        run: |
          echo "🔍 Procurando temas com package.json..."
          THEMES_FOUND=0
          while IFS= read -r pkg; do
            theme_dir=$(dirname "$pkg")
            echo "📦 Processando tema: $theme_dir"
            cd "$theme_dir"
            npm ci --prefer-offline 2>/dev/null || npm install
            npm run build --if-present && echo "✅ Build concluído: $theme_dir" || true
            cd - > /dev/null
            THEMES_FOUND=$((THEMES_FOUND + 1))
          done < <(find wp-content/themes -name "package.json" \
            -not -path "*/node_modules/*" 2>/dev/null | head -5)
          if [ $THEMES_FOUND -eq 0 ]; then
            echo "ℹ️  Nenhum tema personalizado com package.json encontrado."
            echo "ℹ️  (Normal para temas Elementor Pro / Elementor Hello)"
          fi

      - name: 📤 Upload dos Assets Buildados
        uses: actions/upload-artifact@v4
        with:
          name: built-assets
          path: |
            wp-content/themes/**/dist/
            wp-content/themes/**/*.min.css
            wp-content/themes/**/*.min.js
          if-no-files-found: ignore
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Deploy para HostGator via FTP
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy → HostGator
    runs-on: ubuntu-latest
    needs: [validate, build-assets]
    environment:
      name: production
      url: https://entresites.com

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📥 Download Assets Buildados
        uses: actions/download-artifact@v4
        with:
          name: built-assets
          path: wp-content/themes/
        continue-on-error: true

      - name: 📋 Listar Arquivos Alterados
        run: |
          echo "📋 Arquivos alterados neste commit:"
          git diff --name-only HEAD~1 HEAD 2>/dev/null || \
            git show --name-only --format="" HEAD
          echo ""
          echo "📊 Commit: ${{ github.sha }}"
          echo "💬 Mensagem: ${{ github.event.commits[0].message }}"

      - name: 📦 Instalar LFTP
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq lftp
          echo "✅ LFTP instalado: $(lftp --version | head -1)"

      - name: 🚀 Deploy via FTP para HostGator
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER || secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASS || secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || secrets.REMOTE_ROOT || 'public_html' }}
          FULL_SYNC: ${{ github.event.inputs.full_sync || 'false' }}
        run: |
          echo "🌐 Iniciando deploy para HostGator..."
          echo "📡 Host: $FTP_HOST"
          echo "👤 Usuário: $FTP_USER"

          TARGET_DIR=$(echo "$FTP_DIR" | sed 's|^/||;s|/$||')
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="public_html"; fi
          echo "📁 Diretório destino: $TARGET_DIR"

          if [ "$FULL_SYNC" = "true" ]; then
            echo "🔄 Modo: Sincronização COMPLETA"
            MIRROR_FLAGS="--reverse --verbose --parallel=5 --delete"
          else
            echo "⚡ Modo: Deploy INCREMENTAL (apenas arquivos alterados)"
            MIRROR_FLAGS="--reverse --verbose --parallel=5"
          fi

          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force no;
            set ftp:ssl-protect-data no;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 60;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1;
            set ftp:use-feat yes;
            set xfer:parallel-transfer-count 5;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mkdir -p $TARGET_DIR || true;
            mirror $MIRROR_FLAGS \
              --exclude-glob .git \
              --exclude-glob .git/** \
              --exclude-glob .github \
              --exclude-glob .github/** \
              --exclude-glob .gitignore \
              --exclude-glob README.md \
              --exclude-glob *.md \
              --exclude-glob .env \
              --exclude-glob .env.* \
              --exclude-glob wp-config.php \
              --exclude-glob wp-config-sample.php \
              --exclude-glob debug.log \
              --exclude-glob wp-content/debug.log \
              --exclude-glob wp-content/uploads/ \
              --exclude-glob wp-content/upgrade/ \
              --exclude-glob wp-content/cache/ \
              --exclude-glob wp-content/et-cache/ \
              --exclude-glob **/node_modules/ \
              --exclude-glob **/node_modules/** \
              --exclude-glob **/.sass-cache/ \
              --exclude-glob **/package-lock.json \
              --exclude-glob **/yarn.lock \
              --exclude-glob **/composer.lock \
              --exclude-glob **/*.map \
              --exclude-glob **/*.log \
              ./ $TARGET_DIR/
          "
          echo "✅ Arquivos transferidos com sucesso!"

      - name: 🔄 Limpar Cache WordPress via SSH
        if: ${{ (secrets.SSH_HOST != '' || secrets.SSH_SERVER != '') && github.event.inputs.clear_cache != 'false' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SSH_SERVER || secrets.FTP_HOST || secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.SSH_USER || secrets.SSH_USERNAME || secrets.FTP_USERNAME }}
          SSH_PASS: ${{ secrets.SSH_PASS || secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          WP_PATH: ${{ secrets.WP_PATH || secrets.REMOTE_ROOT || '~/public_html' }}
        run: |
          echo "🔄 Limpando cache via SSH..."
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" << SSHEOF
            WP_PATH="${WP_PATH}"
            cd "\$WP_PATH" 2>/dev/null || cd ~/public_html || exit 0

            echo "📂 Diretório WordPress: \$(pwd)"

            if command -v wp &> /dev/null; then
              echo "🗑️ WP-CLI encontrado! Limpando caches..."
              wp cache flush --allow-root 2>/dev/null && echo "✅ Cache do objeto limpo!" || true
              wp transient delete --all --allow-root 2>/dev/null && echo "✅ Transients limpos!" || true
              wp elementor flush-css --allow-root 2>/dev/null && echo "✅ CSS do Elementor regenerado!" || true
              wp rewrite flush --allow-root 2>/dev/null && echo "✅ Rewrite rules renovadas!" || true
              echo "🎉 Todos os caches limpos via WP-CLI!"
            else
              echo "⚠️ WP-CLI não disponível. Removendo cache de arquivos..."
              rm -rf wp-content/cache/* 2>/dev/null || true
              rm -rf wp-content/et-cache/* 2>/dev/null || true
              rm -rf wp-content/uploads/elementor/css/* 2>/dev/null || true
              echo "✅ Cache de arquivos removido!"
            fi
          SSHEOF
        continue-on-error: true

      - name: 📊 Relatório Final de Deploy
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📊 RELATÓRIO DE DEPLOY — WordPress → HostGator"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🌐 Site:       https://entresites.com"
          echo "  📅 Data/Hora:  $(date '+%d/%m/%Y %H:%M:%S') UTC"
          echo "  🔀 Branch:     ${{ github.ref_name }}"
          echo "  📝 Commit:     ${{ github.sha }}"
          echo "  👤 Autor:      ${{ github.actor }}"
          echo "  💬 Mensagem:   ${{ github.event.commits[0].message }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Notificação Final
  # ─────────────────────────────────────────────────────────────
  notify:
    name: 📢 Notificação de Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: 🎉 Deploy com Sucesso
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ DEPLOY BEM-SUCEDIDO!"
          echo "🌐 Site atualizado: https://entresites.com"
          echo "📝 Commit: ${{ github.sha }}"
          echo "🔌 WordPress + Elementor Pro + WooCommerce online!"

      - name: 💥 Falha no Deploy
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ FALHA NO DEPLOY!"
          echo "🔧 Verifique os logs acima para detalhes."
          echo "📝 Commit com erro: ${{ github.sha }}"
          exit 1
