name: Deploy HostGator (entresites.com)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: Sincronizar Arquivos com HostGator
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obter código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Deploy para HostGator (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.FTP_HOST || '50.6.184.19' }}
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS }}
          server-dir: ${{ secrets.FTP_REMOTE_ROOT || './' }}
          protocol: ftp
          port: 21
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            *.md
            .env*
            wp-config*
            node_modules/**
