name: 🚀 Deploy Entre Sites para HostGator (entresites.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🌐 Sincronizar Arquivos com HostGator
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obter código do repositório
        uses: actions/checkout@v4

      - name: 🔍 Validar e Diagnosticar Conexão FTP
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_REMOTE_ROOT || 'public_html' }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          
          echo "=== DIAGNÓSTICO DE CONEXÃO HOSTGATOR ==="
          echo "Host FTP configurado: $FTP_HOST"
          echo "Usuário configurado (primeiros caracteres): ${FTP_USER:0:3}***"
          echo "Diretório Alvo: $FTP_DIR"
          
          # Testa DNS / Ping
          getent hosts "$FTP_HOST" || echo "⚠️ Aviso: Não foi possível resolver DNS para $FTP_HOST"
          
          echo "=== TESTANDO LOGIN FTP ==="
          lftp -d -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force no;
            set ftp:ssl-protect-data no;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 15;
            set net:max-retries 1;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            ls;
            mkdir -p $FTP_DIR || true;
            mirror --reverse --verbose \
              --exclude-glob .git* \
              --exclude-glob .git/** \
              --exclude-glob .github/** \
              --exclude-glob README.md \
              ./ $FTP_DIR/
          "
          
      - name: ✅ Deploy Finalizado
        run: |
          echo "🎉 Processo concluído!"
          echo "🌐 Acesse: https://entresites.com"
